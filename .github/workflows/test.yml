name: Run Tests
# Dispara el pipeline al hacer push o pull request en tu rama de prueba
on:
  push:
    branches:
      - EjeciconPruebaTecnica
  pull_request:
    branches:
      - EjeciconPruebaTecnica
jobs:
  # Job 1: Unitarias del backend
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 21
      - name: Install backend dependencies
        working-directory: ./test-api
        run: npm install
      - name: Run unit tests
        working-directory: ./test-api
        run: npm test
  # Job 2: E2E del frontend
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      backend:
        image: node:21
        ports:
          - 4000:4000
        options: >-
          --health-cmd="curl --fail http://localhost:4000/tasks || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 21
      - name: Install frontend dependencies
        working-directory: ./test-app
        run: npm install
      - name: Run Cypress E2E tests
        working-directory: ./test-app
        run: npx cypress run --headless --browser chrome
