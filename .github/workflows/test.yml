name: Run Tests

on:
  push:
    branches:
      - EjeciconPruebaTecnica
  pull_request:
    branches:
      - EjeciconPruebaTecnica

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myusername
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: test-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myusername -d test-local"
          --health-interval 5s
          --health-retries 5
    env:
      SEQ_USER: myusername
      SEQ_PW: mypassword
      SEQ_DB: test-local
      SEQ_PORT: 5432
      SEQ_HOST: postgres
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 21
      - name: Install backend dependencies
        working-directory: ./test-api
        run: npm install
      - name: Run unit tests
        working-directory: ./test-api
        run: npm test

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myusername
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: test-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myusername -d test-local"
          --health-interval 5s
          --health-retries 5
    env:
      SEQ_USER: myusername
      SEQ_PW: mypassword
      SEQ_DB: test-local
      SEQ_PORT: 5432
      SEQ_HOST: postgres
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 21
      - name: Install backend dependencies
        working-directory: ./test-api
        run: npm install
      - name: Install wait-on globally
        run: npm install -g wait-on
      - name: Start backend in background and wait for DB
        working-directory: ./test-api
        run: |
          echo "Starting backend..."
          npm start > backend.log 2>&1 &
          echo "Waiting for /tasks endpoint..."
          wait-on http://localhost:4000/tasks --timeout 120000 || (cat backend.log && exit 1)
      - name: Install frontend dependencies
        working-directory: ./test-app
        run: npm install
      - name: Run Cypress E2E tests
        working-directory: ./test-app
        run: npx cypress run --headless --browser chrome
