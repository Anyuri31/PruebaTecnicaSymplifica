name: Run Tests

# Se dispara al hacer push o pull request en tu rama de prueba
on:
  push:
    branches:
      - EjeciconPruebaTecnica
  pull_request:
    branches:
      - EjeciconPruebaTecnica

jobs:
  # Job 1: Unitarias del backend
  backend-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myusername
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: test-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myusername -d test-local"
          --health-interval 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 21
      - name: Install backend dependencies
        working-directory: ./test-api
        run: npm install
      - name: Run unit tests
        working-directory: ./test-api
        run: npm test

  # Job 2: E2E del frontend con Cypress
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myusername
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: test-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myusername -d test-local"
          --health-interval 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 21
      - name: Install backend dependencies
        working-directory: ./test-api
        run: npm install
      - name: Start backend in background
        working-directory: ./test-api
        run: |
          npm start > backend.log 2>&1 &
          npx wait-on http://localhost:4000/tasks --timeout 15000
          cat backend.log
      - name: Install frontend dependencies
        working-directory: ./test-app
        run: npm install
      - name: Run Cypress E2E tests
        working-directory: ./test-app
        run: npx cypress run --headless --browser chrome
