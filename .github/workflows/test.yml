name: Run Tests
# Dispara el pipeline al hacer push o pull request en tu rama de prueba
on:
  push:
    branches:
      - EjeciconPruebaTecnica
  pull_request:
    branches:
      - EjeciconPruebaTecnica
jobs:
  # Job 1: Unitarias del backend
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 21
      - name: Install backend dependencies
        working-directory: ./test-api
        run: npm install
      - name: Run unit tests
        working-directory: ./test-api
        run: npm test
  # Job 2: E2E del frontend
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0
      - name: Setup Node.js
        uses: actions/setup-node@v3.9.1
        with:
          node-version: 21
      - name: Install backend dependencies
        working-directory: ./test-api
        run: npm install
      - name: Start backend in background
        working-directory: ./test-api
        run: npm start &
      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:4000/tasks
      - name: Install frontend dependencies
        working-directory: ./test-app
        run: npm install
      - name: Run Cypress E2E tests
        working-directory: ./test-app
        run: npx cypress run --headless --browser chrome
